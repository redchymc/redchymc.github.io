<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedChy | Contact & Reports</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--primary-red);
            letter-spacing: 1px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group textarea {
            padding: 12px;
            background: #000;
            border: 1px solid var(--dark-red);
            border-radius: 6px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }

        /* Estilo personalizado para el input de archivos adjuntos */
        .file-upload-wrapper {
            position: relative;
            border: 2px dashed var(--dark-red);
            padding: 20px;
            text-align: center;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: 0.3s;
        }

        .file-upload-wrapper:hover {
            border-color: var(--primary-red);
            background: rgba(255, 0, 0, 0.05);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-text {
            font-size: 0.9rem;
            color: #ccc;
        }

        .file-upload-text i {
            color: var(--primary-red);
            margin-right: 8px;
        }

        .submit-btn {
            padding: 15px;
            background: #000;
            color: #fff;
            border: 1px solid var(--primary-red);
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            box-shadow: inset 0 0 8px rgba(255, 0, 0, 0.5);
            transition: 0.3s;
            letter-spacing: 2px;
        }

        .submit-btn:hover {
            background: var(--primary-red);
            color: #000;
            box-shadow: 0 0 20px var(--primary-red);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><h1>REDCHY</h1></div>
        <nav style="display: flex; align-items: center; gap: 15px;">
            <div class="social-nav" style="display: flex; gap: 15px; margin-right: 10px;">
                <a href="https://discord.redchy.com" target="_blank" class="social-icon" title="Join our Discord">
                    <i class="fab fa-discord"></i>
                </a>
                <a href="https://youtube.com/@RedChy" target="_blank" class="social-icon" title="Follow us on YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
            </div>
            
            <a href="../" class="nav-link">Home</a>
            <a href="../terms/" class="nav-link">Terms</a>
            <a href="../vote/" class="nav-link">Vote</a>
            <a href="/contact/" class="nav-link active">Contact</a>
            <a href="https://shop.redchy.com" target="_blank" class="nav-link shop-btn">Shop</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h2>CONTACT & REPORTS</h2>
            <p>Send your player reports, bug issues, or inquiries along with proofs.</p>
            
            <!-- Cambia la URL de action por tu endpoint de Formspree (ej. https://formspree.io/f/tu-codigo) -->
            <form action="https://formspree.io/f/xvkonjqp" method="POST" enctype="multipart/form-data" class="contact-form">
                
                <div class="form-group">
                    <label for="name">Your Name / In-Game Username:</label>
                    <input type="text" id="name" name="name" required placeholder="e.g. Steve">
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="_replyto" required placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label for="message">Message / Report Details:</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Describe what happened or state your inquiry..."></textarea>
                </div>

                <div class="form-group">
                    <label>Attachments (Screenshots / Proof):</label>
                    <div class="file-upload-wrapper">
                        <div class="file-upload-text" id="file-label">
                            <i class="fas fa-cloud-upload-alt"></i> Drop files here or click to browse (Images/Videos)
                        </div>
                        <input type="file" name="attachment" id="attachment" accept="image/*,video/*">
                    </div>
                </div>

                <button type="submit" class="submit-btn">SUBMIT</button>
            </form>
        </section>
    </main>

    <script>
        // Script pequeño para mostrar el nombre del archivo seleccionado visualmente
        const fileInput = document.getElementById('attachment');
        const fileLabel = document.getElementById('file-label');

        fileInput.addEventListener('change', (e) => {
            if (fileInput.files.length > 0) {
                fileLabel.innerHTML = `<i class="fas fa-check-circle" style="color: #00ff00;"></i> File selected: ${fileInput.files[0].name}`;
            } else {
                fileLabel.innerHTML = `<i class="fas fa-cloud-upload-alt"></i> Drop files here or click to browse (Images/Videos)`;
            }
        });
    </script>
</body>
</html>
