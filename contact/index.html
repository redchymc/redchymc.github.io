<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedChy | Contact & Reports</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--primary-red);
            letter-spacing: 1px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="url"],
        .form-group textarea {
            padding: 12px;
            background: #000;
            border: 1px solid var(--dark-red);
            border-radius: 6px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }

        .submit-btn {
            padding: 15px;
            background: #000;
            color: #fff;
            border: 1px solid var(--primary-red);
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            box-shadow: inset 0 0 8px rgba(255, 0, 0, 0.5);
            transition: 0.3s;
            letter-spacing: 2px;
        }

        .submit-btn:hover {
            background: var(--primary-red);
            color: #000;
            box-shadow: 0 0 20px var(--primary-red);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><h1>REDCHY</h1></div>
        <nav style="display: flex; align-items: center; gap: 15px;">
            <div class="social-nav" style="display: flex; gap: 15px; margin-right: 10px;">
                <a href="https://discord.redchy.com" target="_blank" class="social-icon" title="Join our Discord">
                    <i class="fab fa-discord"></i>
                </a>
                <a href="https://youtube.com/@RedChy" target="_blank" class="social-icon" title="Follow us on YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
            </div>
            
            <a href="../" class="nav-link">Home</a>
            <a href="../terms/" class="nav-link">Terms</a>
            <a href="../vote/" class="nav-link">Vote</a>
            <a href="/contact/" class="nav-link active">Contact</a>
            <a href="https://shop.redchy.com" target="_blank" class="nav-link shop-btn">Shop</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h2>CONTACT & REPORTS</h2>
            <p>Send your player reports, bug issues, or inquiries along with proof links.</p>
            
            <!-- Formspree configurado con campo de texto para links de pruebas -->
            <form action="https://formspree.io/f/xvkonjqp" method="POST" class="contact-form">
                
                <div class="form-group">
                    <label for="name">Your Name / In-Game Username:</label>
                    <input type="text" id="name" name="name" required placeholder="e.g. Steve">
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="_replyto" required placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label for="message">Message / Report Details:</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Describe what happened or state your inquiry..."></textarea>
                </div>

                <div class="form-group">
                    <label for="proof_link">Proof Link (YouTube, Imgur, Drive, etc.):</label>
                    <input type="url" id="proof_link" name="proof_link" placeholder="https://imgur.com/... or https://drive.google.com/...">
                </div>

                <button type="submit" class="submit-btn">SUBMIT</button>
            </form>
        </section>
    </main>

</body>
</html>
